<div class="cs-root">
  <button
    #triggerBtn
    type="button"
    class="cs-trigger"
    [id]="inputId()"
    [class.is-open]="isOpen()"
    [class.is-filtered]="isFiltered()"
    [disabled]="disabled()"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="isOpen() ? inputId() + '-listbox' : null"
    [attr.aria-activedescendant]="isOpen() && options()[activeIndex()] ? inputId() + '-opt-' + optionKey(options()[activeIndex()].value) : null"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    @if (selectedOption(); as opt) {
      @if (opt.icon) {
        <span class="cs-icon-badge" [class]="'tone-' + (opt.tone || 'neutral')" aria-hidden="true">
          @switch (opt.icon) {
            @case ('active') { <svg lucideCircleCheck class="cs-icon" strokeWidth="2"></svg> }
            @case ('inactive') { <svg lucideCircleOff class="cs-icon" strokeWidth="2"></svg> }
            @case ('sort') { <svg lucideArrowUpDown class="cs-icon" strokeWidth="2"></svg> }
            @default { <svg lucideListFilter class="cs-icon" strokeWidth="2"></svg> }
          }
        </span>
      }
      <span class="cs-trigger-label">{{ opt.label }}</span>
    }
    <svg lucideChevronDown class="cs-chevron" strokeWidth="1.9" aria-hidden="true"></svg>
  </button>

  @if (isOpen()) {
    <div
      class="cs-popover"
      [class.align-right]="align() === 'right'"
      [class.open-up]="openDirection() === 'up'"
      [id]="inputId() + '-listbox'"
      role="listbox"
      [attr.aria-label]="ariaLabel()"
      (keydown)="onListboxKeydown($event)"
    >
      @for (opt of options(); track optionKey(opt.value); let idx = $index) {
        <button
          type="button"
          role="option"
          class="cs-option"
          [id]="inputId() + '-opt-' + optionKey(opt.value)"
          [attr.data-option-value]="optionKey(opt.value)"
          [class.is-selected]="value() === opt.value"
          [class.is-active]="activeIndex() === idx"
          [class.has-desc]="!!opt.description"
          [attr.aria-selected]="value() === opt.value"
          (mouseenter)="activeIndex.set(idx)"
          (click)="selectOption(opt.value)"
        >
          @if (opt.icon) {
            <span class="cs-icon-badge" [class]="'tone-' + (opt.tone || 'neutral')" aria-hidden="true">
              @switch (opt.icon) {
                @case ('active') { <svg lucideCircleCheck class="cs-icon" strokeWidth="2"></svg> }
                @case ('inactive') { <svg lucideCircleOff class="cs-icon" strokeWidth="2"></svg> }
                @case ('sort') { <svg lucideArrowUpDown class="cs-icon" strokeWidth="2"></svg> }
                @default { <svg lucideListFilter class="cs-icon" strokeWidth="2"></svg> }
              }
            </span>
          }
          <span class="cs-option-copy">
            <span class="cs-option-label">{{ opt.label }}</span>
            @if (opt.description) {
              <span class="cs-option-desc">{{ opt.description }}</span>
            }
          </span>
          @if (value() === opt.value) {
            <span class="cs-check-mark" aria-hidden="true">
              <svg lucideCheck class="cs-check-icon" strokeWidth="2.5"></svg>
            </span>
          }
        </button>
      }
    </div>
  }
</div>
