<div class="sfs-root">
  <button
    #triggerBtn
    type="button"
    class="sfs-trigger"
    [id]="inputId()"
    [class.is-open]="isOpen()"
    [class.is-filtered]="isFiltered()"
    [disabled]="disabled()"
    role="combobox"
    aria-haspopup="listbox"
    aria-label="Filtrar por estado"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="isOpen() ? inputId() + '-listbox' : null"
    [attr.aria-activedescendant]="isOpen() && options()[activeIndex()] ? inputId() + '-opt-' + (options()[activeIndex()].value || 'ALL') : null"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    @let meta = selectedMeta();
    <span class="sfs-icon-badge" [class]="'tone-' + meta.tone" aria-hidden="true">
      @switch (meta.icon) {
        @case ('all') { <svg lucideListFilter class="sfs-icon" strokeWidth="2"></svg> }
        @case ('clock') { <svg lucideClock3 class="sfs-icon" strokeWidth="2"></svg> }
        @case ('confirm') { <svg lucideCheck class="sfs-icon" strokeWidth="2.2"></svg> }
        @case ('wrench') { <svg lucideWrench class="sfs-icon" strokeWidth="2"></svg> }
        @case ('play') { <svg lucidePlay class="sfs-icon" strokeWidth="2"></svg> }
        @case ('closed') { <svg lucideCircleCheck class="sfs-icon" strokeWidth="2"></svg> }
        @case ('ban') { <svg lucideBan class="sfs-icon" strokeWidth="2"></svg> }
      }
    </span>
    <span class="sfs-trigger-label">{{ meta.label }}</span>
    <svg lucideChevronDown class="sfs-chevron" strokeWidth="1.9" aria-hidden="true"></svg>
  </button>

  @if (isOpen()) {
    <div
      class="sfs-popover"
      [id]="inputId() + '-listbox'"
      role="listbox"
      aria-label="Filtrar producciones por estado"
      (keydown)="onListboxKeydown($event)"
    >
      @for (opt of options(); track opt.value || 'ALL'; let idx = $index) {
        @if (idx === 1) {
          <div class="sfs-divider" role="separator" aria-hidden="true"></div>
        }
        <button
          type="button"
          role="option"
          class="sfs-option"
          [id]="inputId() + '-opt-' + (opt.value || 'ALL')"
          [attr.data-filter-status]="opt.value || 'ALL'"
          [class.is-selected]="value() === opt.value"
          [class.is-active]="activeIndex() === idx"
          [class.tone-negative]="opt.tone === 'negative'"
          [attr.aria-selected]="value() === opt.value"
          (mouseenter)="activeIndex.set(idx)"
          (click)="selectOption(opt.value)"
        >
          <span class="sfs-icon-badge" [class]="'tone-' + opt.tone" aria-hidden="true">
            @switch (opt.icon) {
              @case ('all') { <svg lucideListFilter class="sfs-icon" strokeWidth="2"></svg> }
              @case ('clock') { <svg lucideClock3 class="sfs-icon" strokeWidth="2"></svg> }
              @case ('confirm') { <svg lucideCheck class="sfs-icon" strokeWidth="2.2"></svg> }
              @case ('wrench') { <svg lucideWrench class="sfs-icon" strokeWidth="2"></svg> }
              @case ('play') { <svg lucidePlay class="sfs-icon" strokeWidth="2"></svg> }
              @case ('closed') { <svg lucideCircleCheck class="sfs-icon" strokeWidth="2"></svg> }
              @case ('ban') { <svg lucideBan class="sfs-icon" strokeWidth="2"></svg> }
            }
          </span>
          <span class="sfs-option-label">{{ opt.label }}</span>
          @if (value() === opt.value) {
            <span class="sfs-check-mark" aria-hidden="true">
              <svg lucideCheck class="sfs-check-icon" strokeWidth="2.5"></svg>
            </span>
          }
        </button>
      }
    </div>
  }
</div>
