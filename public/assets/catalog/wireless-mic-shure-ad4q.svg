<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Quad-Channel Digital Receiver Rack Unit -->
  <rect x="6" y="34" width="52" height="18" rx="2.5" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <rect x="9" y="37" width="32" height="12" rx="1.5" fill="#020617" stroke="#0284C7" stroke-width="0.8"/>
  <!-- Channel RF Meters -->
  <line x1="13" y1="46" x2="13" y2="40" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="19" y1="46" x2="19" y2="39" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="25" y1="46" x2="25" y2="41" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="31" y1="46" x2="31" y2="39" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="47" cy="43" r="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>
