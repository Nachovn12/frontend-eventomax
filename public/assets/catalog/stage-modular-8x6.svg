<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Perspective Stage Platform Deck -->
  <polygon points="8,26 56,26 50,38 14,38" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <!-- Non-slip Textured Grid Deck Surface -->
  <polygon points="10,27 54,27 49,37 15,37" fill="#0F172A"/>
  <line x1="20" y1="27" x2="22" y2="37" stroke="#334155" stroke-width="0.75"/>
  <line x1="32" y1="27" x2="32" y2="37" stroke="#334155" stroke-width="0.75"/>
  <line x1="44" y1="27" x2="42" y2="37" stroke="#334155" stroke-width="0.75"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#334155" stroke-width="0.75"/>

  <!-- Front Fascia Skirt / Aluminum Profile -->
  <rect x="14" y="38" width="36" height="5" fill="#475569" stroke="#334155" stroke-width="0.75"/>

  <!-- Heavy Duty Telescopic Aluminum Legs -->
  <!-- Leg 1 (Front Left) -->
  <rect x="15" y="43" width="3.5" height="13" fill="#64748B"/>
  <rect x="14" y="55" width="5.5" height="2" rx="0.5" fill="#1E293B"/> <!-- Rubber foot -->
  <!-- Leg 2 (Front Center) -->
  <rect x="30" y="43" width="3.5" height="13" fill="#64748B"/>
  <rect x="29" y="55" width="5.5" height="2" rx="0.5" fill="#1E293B"/>
  <!-- Leg 3 (Front Right) -->
  <rect x="45.5" y="43" width="3.5" height="13" fill="#64748B"/>
  <rect x="44.5" y="55" width="5.5" height="2" rx="0.5" fill="#1E293B"/>

  <!-- Rear Legs (in perspective shadow) -->
  <rect x="9" y="30" width="2.5" height="18" fill="#334155"/>
  <rect x="52.5" y="30" width="2.5" height="18" fill="#334155"/>

  <!-- Safety Handrail / Back Truss -->
  <path d="M12 26 V13 H52 V26" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="12" y1="19" x2="52" y2="19" stroke="#94A3B8" stroke-width="1"/>
  <line x1="25" y1="13" x2="25" y2="26" stroke="#94A3B8" stroke-width="1"/>
  <line x1="39" y1="13" x2="39" y2="26" stroke="#94A3B8" stroke-width="1"/>
</svg>
