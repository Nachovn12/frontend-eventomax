<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Lifting Eyelet / Top Hook -->
  <path d="M28 8 C28 5 36 5 36 8" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <!-- Exhaust Stack Pipe -->
  <rect x="46" y="8" width="4" height="6" rx="1" fill="#475569"/>
  <path d="M44 8 H52" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Main Soundproof Canopy (Yellow/Amber Industrial Enclosure) -->
  <rect x="8" y="14" width="48" height="38" rx="4" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>

  <!-- Base Skid Steel Beam -->
  <rect x="6" y="48" width="52" height="6" rx="2" fill="#1E293B"/>
  <circle cx="14" cy="51" r="1.5" fill="#64748B"/>
  <circle cx="50" cy="51" r="1.5" fill="#64748B"/>

  <!-- Left Access Door with Louvered Vents -->
  <rect x="12" y="18" width="20" height="26" rx="2" fill="#D97706" stroke="#B45309" stroke-width="0.75"/>
  <line x1="16" y1="23" x2="28" y2="23" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="27" x2="28" y2="27" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="31" x2="28" y2="31" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="35" x2="28" y2="35" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="29" cy="38" r="1" fill="#1E293B"/> <!-- Door latch -->

  <!-- Right Electrical Control Panel Door -->
  <rect x="34" y="18" width="18" height="26" rx="2" fill="#1E293B"/>
  <!-- Digital Controller Window -->
  <rect x="37" y="21" width="12" height="7" rx="1" fill="#0284C7"/>
  <path d="M39 24 H47" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
  <!-- Emergency Stop Button (E-Stop) -->
  <circle cx="43" cy="33" r="2.5" fill="#EF4444"/>
  <circle cx="43" cy="33" r="1" fill="#FEE2E2"/>
  <!-- Breaker / Outlet Sockets -->
  <rect x="37" y="38" width="4" height="3" rx="0.5" fill="#64748B"/>
  <rect x="44" y="38" width="5" height="3" rx="0.5" fill="#3B82F6"/>

  <!-- High Voltage Flash Icon on Left Door -->
  <path d="M22 17 L20 20 H23 L21 23" stroke="#FEF08A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
