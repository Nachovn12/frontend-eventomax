<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ground Floor Slab -->
  <rect x="6" y="51" width="52" height="4" rx="1" fill="#334155"/>
  <!-- Structural Aluminum Columns -->
  <rect x="10" y="26" width="3" height="25" fill="#475569"/>
  <rect x="51" y="26" width="3" height="25" fill="#475569"/>
  <rect x="30.5" y="28" width="3" height="23" fill="#1E293B"/>
  <!-- Pitched Canopy Roof (20x15m Structural Marquee) -->
  <path d="M6 27 L32 10 L58 27 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M12 26 L32 13 L52 26 Z" fill="#1E293B"/>
  <!-- Cross Truss Bracing -->
  <line x1="13" y1="27" x2="30.5" y2="41" stroke="#64748B" stroke-width="1" stroke-dasharray="2 1.5"/>
  <line x1="51" y1="27" x2="33.5" y2="41" stroke="#64748B" stroke-width="1" stroke-dasharray="2 1.5"/>
  <!-- Interior Event Lighting & Windows -->
  <rect x="16" y="32" width="11" height="14" rx="1.5" fill="#020617" stroke="#0284C7" stroke-width="0.9"/>
  <rect x="37" y="32" width="11" height="14" rx="1.5" fill="#020617" stroke="#0284C7" stroke-width="0.9"/>
  <circle cx="21.5" cy="36" r="1.5" fill="#38BDF8"/>
  <circle cx="42.5" cy="36" r="1.5" fill="#38BDF8"/>
  <!-- Roof Ridge Finial -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="1.5" fill="#10B981"/>
</svg>
