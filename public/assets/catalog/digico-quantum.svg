  <line x1="49" y1="21" x2="49" y2="28" stroke="#EF4444" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Fader Bay Section -->
  <rect x="8" y="36" width="48" height="12" rx="2" fill="#182234"/>
  <!-- Fader Slots & Knobs -->
  <line x1="13" y1="38" x2="13" y2="46" stroke="#334155" stroke-width="1"/>
  <circle cx="13" cy="41" r="1.75" fill="#38BDF8"/>
  <line x1="19" y1="38" x2="19" y2="46" stroke="#334155" stroke-width="1"/>
  <circle cx="19" cy="43" r="1.75" fill="#38BDF8"/>
  <line x1="25" y1="38" x2="25" y2="46" stroke="#334155" stroke-width="1"/>
  <circle cx="25" cy="40" r="1.75" fill="#38BDF8"/>
  <line x1="31" y1="38" x2="31" y2="46" stroke="#334155" stroke-width="1"/>
  <circle cx="31" cy="44" r="1.75" fill="#38BDF8"/>
  <line x1="37" y1="38" x2="37" y2="46" stroke="#334155" stroke-width="1"/>
  <circle cx="37" cy="39" r="1.75" fill="#38BDF8"/>
  <line x1="43" y1="38" x2="43" y2="46" stroke="#334155" stroke-width="1"/>
