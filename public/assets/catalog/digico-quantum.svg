  <rect x="5" y="15" width="54" height="36" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  
  <!-- Top Angled Screen Area -->
  <rect x="8" y="18" width="48" height="15" rx="3" fill="#0B132B" stroke="#2563EB" stroke-width="0.75"/>
