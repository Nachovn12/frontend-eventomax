  <path d="M12 26 L15 23 L18 27 L22 21 L26 25 L30 22" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="20" width="20" height="11" rx="2" fill="#0F172A"/>
  <!-- Channel meters on screen 2 -->
  <line x1="37" y1="23" x2="37" y2="28" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>
