<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Pro Flight Case / Road Case -->
  <rect x="10" y="14" width="44" height="38" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Aluminum Extrusion Edges -->
  <line x1="10" y1="33" x2="54" y2="33" stroke="#64748B" stroke-width="2"/>
  <rect x="10" y="14" width="44" height="38" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Metal Ball Corners -->
  <path d="M10 18 Q14 18 14 14" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54 18 Q50 18 50 14" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 48 Q14 48 14 52" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M54 48 Q50 48 50 52" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Butterfly Latches -->
  <rect x="29" y="30" width="6" height="6" rx="1" fill="#64748B" stroke="#94A3B8" stroke-width="0.75"/>
  <circle cx="32" cy="33" r="1.2" fill="#0F172A"/>

  <!-- Recessed Spring Handle -->
  <rect x="22" y="21" width="20" height="7" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <path d="M25 24.5 H39" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Wheel Castors -->
  <rect x="14" y="52" width="6" height="4" rx="1" fill="#334155"/>
  <rect x="44" y="52" width="6" height="4" rx="1" fill="#334155"/>
</svg>
