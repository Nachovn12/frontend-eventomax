<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rigging Bumper Flybar -->
  <path d="M16 8 H48 L46 12 H18 Z" fill="#334155" stroke="#1E293B" stroke-width="1"/>
  <circle cx="32" cy="7" r="2" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="20" y1="12" x2="20" y2="15" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="44" y1="12" x2="44" y2="15" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Speaker Box 1 (Top Module) -->
  <rect x="12" y="15" width="40" height="11" rx="2" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="21" cy="20.5" r="3.5" fill="#1E293B" stroke="#475569" stroke-width="0.75"/>
  <rect x="28" y="18" width="8" height="5" rx="1" fill="#0284C7"/>
  <circle cx="43" cy="20.5" r="3.5" fill="#1E293B" stroke="#475569" stroke-width="0.75"/>

  <!-- Speaker Box 2 (Curved Mid Module) -->
  <path d="M13 27 H51 L50 38 H14 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="22" cy="32.5" r="3.5" fill="#1E293B" stroke="#475569" stroke-width="0.75"/>
  <rect x="29" y="30" width="6" height="5" rx="1" fill="#0284C7"/>
  <circle cx="42" cy="32.5" r="3.5" fill="#1E293B" stroke="#475569" stroke-width="0.75"/>

  <!-- Speaker Box 3 (Splayed Bottom Module) -->
  <path d="M15 39 H49 L47 49 H17 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="23" cy="44" r="3" fill="#1E293B" stroke="#475569" stroke-width="0.75"/>
