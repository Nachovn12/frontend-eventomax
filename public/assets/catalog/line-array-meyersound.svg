  <circle cx="41" cy="44" r="3" fill="#1E293B" stroke="#475569" stroke-width="0.75"/>

  <!-- Meyer Sound Badge / Pin hardware -->
  <rect x="30" y="52" width="4" height="2" rx="0.5" fill="#38BDF8"/>
  <line x1="16" y1="26" x2="16" y2="40" stroke="#64748B" stroke-width="1.2"/>
