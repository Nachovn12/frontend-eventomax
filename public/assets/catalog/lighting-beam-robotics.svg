<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Base Chassis with Display -->
  <rect x="14" y="46" width="36" height="11" rx="2.5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <!-- DMX LCD Display & Controls -->
  <rect x="24" y="49" width="16" height="5" rx="1" fill="#0284C7"/>
  <circle cx="21" cy="51.5" r="1" fill="#64748B"/>
  <circle cx="43" cy="51.5" r="1" fill="#64748B"/>
  <!-- Base Handles -->
  <path d="M12 50 H14 M50 50 H52" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Yoke Arms (U-Bracket) -->
  <path d="M20 46 V33 C20 31 22 29 25 29 H39 C42 29 44 31 44 33 V46" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Moving Head Fixture Body -->
  <rect x="22" y="16" width="20" height="20" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <!-- Cooling Vents on Head -->
  <line x1="25" y1="21" x2="25" y2="29" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="39" y1="21" x2="39" y2="29" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Front Optical Lens Aperture -->
  <circle cx="32" cy="25" r="7" fill="#1E1B4B" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="32" cy="25" r="4.5" fill="#8B5CF6"/>
  <circle cx="32" cy="25" r="2.5" fill="#C4B5FD"/>
  <circle cx="33" cy="24" r="1" fill="#FFFFFF"/>

  <!-- Light Beam Glow / Projection Aura -->
  <path d="M28 17 L22 8 M32 16 L32 6 M36 17 L42 8" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>
