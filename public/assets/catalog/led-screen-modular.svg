<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Aluminum Cabinet Frame -->
  <rect x="7" y="10" width="50" height="44" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Corner Rigging Locking Blocks -->
  <rect x="6" y="9" width="4" height="4" rx="1" fill="#64748B"/>
  <rect x="54" y="9" width="4" height="4" rx="1" fill="#64748B"/>
  <rect x="6" y="51" width="4" height="4" rx="1" fill="#64748B"/>
  <rect x="54" y="51" width="4" height="4" rx="1" fill="#64748B"/>

  <!-- High-Contrast LED Screen Display -->
  <rect x="10" y="13" width="44" height="38" rx="1.5" fill="#020617"/>

  <!-- 4 Module Tile Separation Lines (500x500mm tiles) -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="#1E293B" stroke-width="1"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#1E293B" stroke-width="1"/>

  <!-- LED Pixel Matrix Grid Pattern -->
  <circle cx="16" cy="19" r="1.2" fill="#2563EB"/>
  <circle cx="22" cy="19" r="1.2" fill="#06B6D4"/>
  <circle cx="28" cy="19" r="1.2" fill="#3B82F6"/>

  <circle cx="36" cy="19" r="1.2" fill="#8B5CF6"/>
  <circle cx="42" cy="19" r="1.2" fill="#EC4899"/>
  <circle cx="48" cy="19" r="1.2" fill="#F43F5E"/>

  <circle cx="16" cy="25" r="1.2" fill="#10B981"/>
  <circle cx="22" cy="25" r="1.2" fill="#3B82F6"/>
  <circle cx="28" cy="25" r="1.2" fill="#06B6D4"/>

  <circle cx="36" cy="25" r="1.2" fill="#F59E0B"/>
  <circle cx="42" cy="25" r="1.2" fill="#EF4444"/>
  <circle cx="48" cy="25" r="1.2" fill="#8B5CF6"/>

  <!-- Lower video scene graph visual -->
  <path d="M14 45 L22 38 L30 43 L40 36 L50 42" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="36" r="2" fill="#F43F5E"/>

  <!-- Status / Signal Power LEDs on Top Bezel -->
  <circle cx="28" cy="11.5" r="0.8" fill="#10B981"/>
  <circle cx="31" cy="11.5" r="0.8" fill="#38BDF8"/>
  <circle cx="34" cy="11.5" r="0.8" fill="#10B981"/>
</svg>
